name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    name: DogEngine (Android)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libasound2-dev \
            libpulse-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libxext-dev \
            libxinerama-dev \
            libxi-dev \
            libxrandr-dev \
            libxxf86vm-dev \
            libx11-dev \
            libdbus-1-dev \
            libudev-dev \
            libgtk-3-dev

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager --install "ndk;25.2.9519653"

      - name: Set Android environment variables
        run: |
          echo "ANDROID_SDK=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Set up Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7

      - name: Configure git for full fetch
        run: |
          git config --global fetch.parallel 0
          git config --global http.postBuffer 1048576000

      - name: Install haxelib dependencies
        run: |
          haxe -version
          haxelib install hmm --quiet
          haxelib run hmm install --quiet

      - name: Init submodules for lime dependency
        run: |
          LIME_PATH=$(haxelib libpath lime)
          cd "$LIME_PATH"
          git submodule update --init --recursive

      - name: Build hxcpp command-line tool
        run: |
          HXCPP_PATH=$(haxelib libpath hxcpp)
          cd "$HXCPP_PATH/tools/hxcpp"
          haxe compile.hxml

      - name: Build Lime host ndll
        run: haxelib run lime rebuild cpp

      - name: Install lime and openfl (Android only)
        run: haxelib run lime setup android -y

      - name: Rebuild native Lime libraries for Android
        run: haxelib run lime rebuild android

      - name: Build Android
        run: haxelib run lime build android

      - name: Locate APK
        id: locate_apk
        run: |
          APK_PATH=$(find export -name "*.apk" | head -n 1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DogEngine (Android)
          path: ${{ steps.locate_apk.outputs.apk_path }}
