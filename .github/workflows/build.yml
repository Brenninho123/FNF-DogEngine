name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    name: DogEngine (Android)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager --install "ndk;25.2.9519653"

      - name: Set up Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7

      - name: Configure git for full fetch
        run: |
          git config --global fetch.parallel 0
          git config --global http.postBuffer 1048576000

      - name: Install haxelib dependencies
        run: |
          haxe -version
          haxelib install hmm --quiet
          haxelib run hmm install --quiet

      - name: Install lime and openfl
        run: |
          haxelib run lime setup -y

      - name: Set ANDROID_NDK_ROOT
        run: echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Build Android
        run: haxelib run lime build android

      - name: Locate APK
        id: locate_apk
        run: |
          APK_PATH=$(find export -name "*.apk" | head -n 1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DogEngine (Android)
          path: ${{ steps.locate_apk.outputs.apk_path }}
